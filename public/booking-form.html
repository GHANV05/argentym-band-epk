<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Booking inquiry registration</title></head>
  <body>
    <form name="booking-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking-inquiry" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" type="tel" />
      <input name="organization" />
      <input name="event_type" />
      <input name="event_date" type="date" />
      <input name="city" />
      <input name="capacity" />
      <input name="budget" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
